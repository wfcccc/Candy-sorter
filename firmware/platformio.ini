; ============================================================
;  三舵机糖豆分色器 v3 — PlatformIO 工程配置
;  主控: ESP32 DevKitC / NodeMCU-32S
;  框架: Arduino + FreeRTOS (ESP32 Arduino Core 内置 FreeRTOS)
; ------------------------------------------------------------
;  机构: 泡棉板 L 形骨架
;        单列导管 -> 挡板A/B 双闸门 -> 单颗测色仓 -> 摇臂斜导流槽 -> 方盒
;  传感: AS7341 11 通道光谱传感器 (I2C 0x39, 板载白光 LED)
;  舵机: SG90 x3  (GPIO13 挡板A / GPIO14 挡板B / GPIO4 底部摇臂)
; ------------------------------------------------------------
;  使用方式:
;    1. 安装 VS Code + PlatformIO IDE 插件
;    2. 用 PlatformIO 打开本 firmware 目录
;    3. 点击 "Build"  编译
;    4. 点击 "Upload" 烧录 (USB 数据线)
;    5. 点击 "Monitor" 查看串口日志 (115200)
;    6. 串口发 'h' 看命令, 发 'm' 进手动调试模式调机械, 发 't' 看原始光谱
; ============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; ---- 串口与烧录 ----
monitor_speed = 115200
upload_speed  = 921600
monitor_filters = esp32_exception_decoder, time

; ---- 编译选项 ----
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -Wall

; ---- 依赖库 (PlatformIO 会自动下载) ----
; 注意: AS7341 的库依赖 Adafruit BusIO, PlatformIO 会自动带上, 这里显式写出便于排查
lib_deps =
    adafruit/Adafruit AS7341                 ; 11 通道光谱颜色传感器驱动
    adafruit/Adafruit BusIO                  ; Adafruit I2C 底层库
    madhephaestus/ESP32Servo@^3.0.5          ; ESP32 舵机 PWM 驱动 (3 路 SG90)
    olikraus/U8g2@^2.35.19                   ; OLED 显示驱动
    adafruit/Adafruit NeoPixel@^1.12.0       ; WS2812 状态灯
